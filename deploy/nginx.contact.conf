# Reference copy of the Contact proxy block.
# The live configuration is versioned in nginx.conf (location = /api/contact).
# Keep this file aligned when changing timeouts, headers, or the trusted NPM CIDR.
#
# Trust chain on the VPS:
# 1. Browser → Nginx Proxy Manager (proxy-network 172.19.0.0/16, e.g. 172.19.0.4).
# 2. NPM overwrites X-Real-IP with the visitor TCP address.
# 3. coconsult-web accepts that rewrite only from 172.19.0.0/16 (set_real_ip_from).
# 4. Nginx forwards $remote_addr as X-Real-IP to Contact and clears X-Forwarded-For.
# 5. Contact trusts X-Real-IP only from CONTACT_TRUST_CIDRS (10.230.22.0/24).
#
# Do not widen set_real_ip_from beyond the VPS proxy-network CIDR.
# Do not publish port 8080. Do not proxy to 127.0.0.1 inside the web container.

set_real_ip_from 172.19.0.0/16;
real_ip_header X-Real-IP;
real_ip_recursive off;

location = /api/contact {
  resolver 127.0.0.11 ipv6=off valid=10s;
  set $contact_upstream coconsult-contact;
  proxy_pass http://$contact_upstream:3602;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For "";
  proxy_set_header Connection "";
  client_max_body_size 20k;
  proxy_connect_timeout 3s;
  proxy_read_timeout 12s;
  proxy_send_timeout 12s;
}
