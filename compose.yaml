# Public HTTP stays on Nginx Proxy Manager.
# This service publishes 8080 only on the host loopback, port 3601.
# The VPS override compose.proxy.yaml (not versioned) attaches proxy-network.
# The contact sender is not part of this file. See compose.contact.yaml
# and docs/CONTACT_ACTIVATION.md. Do not add it here until that checklist is accepted.
# Deploy with:
#   docker compose -p coconsult -f compose.yaml -f compose.proxy.yaml up -d --build
services:
  coconsult-web:
    build: .
    container_name: coconsult-web
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /var/cache/nginx:rw,noexec,nosuid,size=16m
      - /var/run:rw,noexec,nosuid,size=2m
    ports:
      - "127.0.0.1:3601:8080"
    mem_limit: 128m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
