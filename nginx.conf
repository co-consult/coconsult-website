server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    absolute_redirect off;
    port_in_redirect off;
    server_name_in_redirect off;

    # NPM on the VPS sits on proxy-network (172.19.0.0/16, e.g. 172.19.0.4).
    # Only that peer may replace $remote_addr via X-Real-IP.
    # Do not widen this to a broader RFC1918 Docker range.
    # X-Forwarded-For from the browser is never used as the client address.
    set_real_ip_from 172.19.0.0/16;
    real_ip_header X-Real-IP;
    real_ip_recursive off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'; object-src 'none'" always;

    # return inside if is safe. Exact legacy paths win over the slash redirect below.
    if ($legacy_redirect != "") {
        return 301 $legacy_redirect$is_args$args;
    }
    if ($legacy_gone = "1") {
        return 410;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Exact match wins over the extensionless slash redirect below.
    # Upstream is reachable only on the private coconsult-contact network.
    # Variable + Docker DNS so the site still boots when Contact is absent (CI, rollback).
    # CONTACT_SEND_ENABLED stays false until docs/CONTACT_ACTIVATION.md is accepted.
    # WordPress files and job posts. Prefix match, still a relative response, never the homepage.
    location ^~ /wp-content/ { return 410; }
    location ^~ /wp-includes/ { return 410; }
    location ^~ /wp-admin/ { return 410; }
    location ^~ /wp-json/ { return 410; }
    location = /wp-login.php { return 410; }
    location = /xmlrpc.php { return 410; }
    location = /jobs { return 410; }
    location ^~ /jobs/ { return 410; }
    location ^~ /author/ { return 410; }
    location ^~ /blog { return 410; }

    location = /api/contact {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $contact_upstream coconsult-contact;
        proxy_pass http://$contact_upstream:3602;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Connection "";
        client_max_body_size 20k;
        proxy_connect_timeout 3s;
        proxy_read_timeout 12s;
        proxy_send_timeout 12s;
    }

    # Extensionless paths without a trailing slash. Exact /healthz and /api/contact win before this regex.
    location ~ ^/[^.]*[^/]$ {
        return 301 $uri/;
    }

    location /assets/ {
        expires 7d;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }

    error_page 404 @err404;
    location @err404 {
        internal;
        if ($request_uri ~ ^/en(/|$)) {
            rewrite ^ /en/404/index.html break;
        }
        rewrite ^ /404.html break;
    }
}
