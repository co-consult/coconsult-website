# Coconsult public site. Listen on 8080 inside the container only.
# Nginx Proxy Manager terminates 80/443. Do not publish 8080 on the host.
# absolute_redirect and port_in_redirect stay off so a slash redirect
# cannot be rewritten to http://<host>:8080/... (that URL previously reached Jenkins).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    absolute_redirect off;
    port_in_redirect off;
    server_name_in_redirect off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'; object-src 'none'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Extensionless paths without a trailing slash. Exact /healthz wins before this regex.
    location ~ ^/[^.]*[^/]$ {
        return 301 $uri/;
    }

    location /assets/ {
        expires 7d;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }

    error_page 404 @err404;
    location @err404 {
        internal;
        if ($request_uri ~ ^/en(/|$)) {
            rewrite ^ /en/404/index.html break;
        }
        rewrite ^ /404.html break;
    }
}
