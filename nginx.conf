    default 0;

    /consultant 1;
    /consultant/ 1;
    /scrum-master 1;
    /scrum-master/ 1;
    /business-analyst 1;
    /business-analyst/ 1;
    /product-owner 1;
    /product-owner/ 1;
    /management 1;
    /management/ 1;
    /service-delivery-management 1;
    /service-delivery-management/ 1;
    /opportunite-it 1;
    /opportunite-it/ 1;
    /job-openings 1;
    /job-openings/ 1;
    /opportunites-carriere-coconsult 1;
    /opportunites-carriere-coconsult/ 1;
    /hotellerie 1;
    /hotellerie/ 1;
    /assurance-et-protection-sociale 1;
    /assurance-et-protection-sociale/ 1;
