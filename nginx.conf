# Coconsult public site. Listen on 8080 inside the container only.
# Nginx Proxy Manager terminates 80/443. Do not publish 8080 on the host.
# absolute_redirect and port_in_redirect stay off so a slash redirect
# cannot be rewritten to http://<host>:8080/... (that URL previously reached Jenkins).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    absolute_redirect off;
    port_in_redirect off;
    server_name_in_redirect off;

    # NPM on the VPS sits on proxy-network (172.19.0.0/16, e.g. 172.19.0.4).
    # Only that peer may replace $remote_addr via X-Real-IP.
    # Do not widen this to a broader RFC1918 Docker range.
    # X-Forwarded-For from the browser is never used as the client address.
    set_real_ip_from 172.19.0.0/16;
    real_ip_header X-Real-IP;
    real_ip_recursive off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'; object-src 'none'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Exact match wins over the extensionless slash redirect below.
    # Upstream is reachable only on the private coconsult-contact network.
    # CONTACT_SEND_ENABLED stays false until docs/CONTACT_ACTIVATION.md is accepted.
    location = /api/contact {
        proxy_pass http://coconsult-contact:3602;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Connection "";
        client_max_body_size 20k;
        proxy_connect_timeout 3s;
        proxy_read_timeout 12s;
        proxy_send_timeout 12s;
    }

    # Extensionless paths without a trailing slash. Exact /healthz and /api/contact win before this regex.
    location ~ ^/[^.]*[^/]$ {
        return 301 $uri/;
    }

    location /assets/ {
        expires 7d;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }

    error_page 404 @err404;
    location @err404 {
        internal;
        if ($request_uri ~ ^/en(/|$)) {
            rewrite ^ /en/404/index.html break;
        }
        rewrite ^ /404.html break;
    }
}
