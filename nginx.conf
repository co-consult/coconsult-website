# Coconsult public site. Listen on 8080 inside the container only.
# Nginx Proxy Manager terminates 80/443. Do not publish 8080 on the host.
# absolute_redirect and port_in_redirect stay off so a slash redirect
# cannot be rewritten to http://<host>:8080/... (that URL previously reached Jenkins).

# Former WordPress URLs. This file is included from http context, so map is valid here.
# Values are relative paths. The server block appends the original query string.
# Do not point these at /. A path that is both a key and a value would loop.
map $uri $legacy_redirect {
    default "";

    /nos-offres /services/;
    /nos-offres/ /services/;
    /services-et-technologie /services/;
    /services-et-technologie/ /services/;

    /react /services/developpement/;
    /react/ /services/developpement/;
    /node-js /services/developpement/;
    /node-js/ /services/developpement/;
    /angular /services/developpement/;
    /angular/ /services/developpement/;
    /java /services/developpement/;
    /java/ /services/developpement/;
    /net /services/developpement/;
    /net/ /services/developpement/;
    /developpement /services/developpement/;
    /developpement/ /services/developpement/;
